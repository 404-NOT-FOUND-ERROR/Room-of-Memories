<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a7e5dd">
<title>还住在这里 · 海风小屋</title>
<style>
:root{--ink:#182d29;--paper:#fffef4;--yellow:#ffe04e;--green:#80d25a;--teal:#2bb6a4;--coral:#ff7d70;--shadow:4px 4px 0 var(--ink)}
*{box-sizing:border-box;letter-spacing:0}
html,body{height:100%;width:100%;margin:0;overflow:hidden;background:#a7e5dd;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--coral);outline-offset:4px}
#world{position:fixed;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%;outline:none}
#panel{position:fixed;z-index:4;left:24px;top:24px;width:292px;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--shadow);max-height:calc(100dvh - 48px);overflow:auto}
summary{list-style:none;cursor:pointer;padding:16px 16px 13px;user-select:none}
summary::-webkit-details-marker{display:none}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand-mark{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:850}
.brand-mark i{width:9px;height:9px;border:1.5px solid var(--ink);background:var(--green);border-radius:50%}
.edition{font-size:10px;font-weight:700;opacity:.55}
.heading-row{display:flex;align-items:center;justify-content:space-between;margin:10px 0 5px}
h1{font-size:26px;line-height:1.15;margin:0;font-weight:900}
.fold{height:26px;width:26px;display:grid;place-items:center;border:1.5px solid var(--ink);background:var(--yellow)}
.fold svg{width:16px;height:16px;transition:transform .16s}
details[open] .fold svg{transform:rotate(180deg)}
.subtitle{font-size:11px;line-height:1.45;opacity:.66;margin:0}
.controls{padding:0 16px 16px;border-top:2px solid var(--ink)}
.section{padding-top:14px}
.section+.section{margin-top:14px;border-top:1px solid #c9d2c8}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
label,.label{font-size:11px;font-weight:800}
.seed-row{display:flex;gap:7px;margin-top:7px}
#seed{min-width:0;width:100%;height:36px;border:1.5px solid var(--ink);background:#f5f8e9;padding:0 9px;font:700 11px ui-monospace,Consolas,monospace}
.icon-button{width:36px;height:36px;flex:none;display:grid;place-items:center;border:1.5px solid var(--ink);background:var(--yellow);box-shadow:2px 2px 0 var(--ink);padding:0}
.icon-button svg{height:17px;width:17px;stroke-width:2}
.icon-button:hover,.command:hover{transform:translate(-1px,-1px)}
.icon-button:active,.command:active{transform:translate(1px,1px);box-shadow:none}
.icon-button[aria-pressed=true]{background:var(--teal)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.switch{position:relative;display:flex;align-items:center;gap:9px;cursor:pointer}
.switch input{position:absolute;width:38px;height:22px;right:0;margin:0;opacity:0;cursor:pointer}
.switch-track{width:34px;height:19px;border:1.5px solid var(--ink);background:#d4e0d4;position:relative;pointer-events:none}
.switch-track:after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--ink);transition:transform .15s}
.switch input:checked+.switch-track{background:var(--green)}
.switch input:checked+.switch-track:after{transform:translateX(15px)}
.switch input:focus-visible+.switch-track{outline:3px solid var(--coral);outline-offset:3px}
#timeValue{font:800 21px/1 ui-monospace,Consolas,monospace}
#time{display:block;width:100%;margin:12px 0 5px;accent-color:var(--coral);cursor:pointer;height:18px}
.time-labels{display:flex;justify-content:space-between;font-size:9px;opacity:.58}
.command{display:flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);background:var(--paper);height:33px;font-size:11px;font-weight:800;padding:0 10px}
.command svg{height:14px;width:14px}
.command[aria-pressed=true]{background:var(--green)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.resident-line{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;font-weight:800}
.resident-dot{height:12px;width:12px;background:var(--coral);border:1.5px solid var(--ink);border-radius:50%}
#activity{font-size:12px;line-height:1.7;margin:0;min-height:40px}
#dayLabel{font:700 10px ui-monospace,Consolas,monospace;opacity:.58}
#status{position:fixed;z-index:2;right:24px;top:25px;display:flex;align-items:center;gap:9px;font-size:11px;font-weight:750;background:var(--paper);border:1.5px solid var(--ink);padding:8px 12px;box-shadow:2px 2px 0 var(--ink)}
.weather-dot{height:8px;width:8px;border-radius:50%;background:var(--yellow);border:1px solid var(--ink)}
#diary{position:fixed;z-index:2;bottom:26px;left:24px;max-width:280px;border-left:3px solid var(--ink);padding-left:12px;pointer-events:none}
#diary strong{display:block;font-size:10px;opacity:.55;margin-bottom:6px;font-weight:750}
#diary p{font-size:12px;line-height:1.6;margin:0;font-weight:650}
#viewTools{position:fixed;right:24px;bottom:26px;z-index:3;display:flex;gap:8px}
#viewTools .icon-button{background:var(--paper);height:38px;width:38px}
#viewTools .icon-button[aria-pressed=true]{background:var(--yellow)}
#toast{position:fixed;z-index:10;left:50%;bottom:26px;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:10px 15px;color:var(--paper);background:var(--ink);font-size:12px;transition:.18s;max-width:calc(100vw - 30px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;z-index:12;background:#a7e5dd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;font-size:13px;font-weight:750}
#loading[hidden]{display:none}
.loader-symbol{width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;border-top-color:transparent;animation:spin 1s linear infinite}
#retry{display:none}
#loading.failed .loader-symbol{animation:none;border-top-color:var(--ink);background:var(--coral)}
#loading.failed #retry{display:flex}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){
 #panel{left:12px;top:12px;width:calc(100% - 24px);max-height:calc(100dvh - 150px)}
 summary{padding:11px 13px 10px}
 .brand{display:none}.heading-row{margin:0 0 4px}h1{font-size:22px}
 .fold{height:24px;width:24px}.subtitle{font-size:10px}
 .controls{padding:0 13px 13px}
 .section{padding-top:10px}.section+.section{margin-top:10px}
 #status{top:111px;right:14px;padding:6px 9px;font-size:10px}
 #diary{left:16px;bottom:24px;max-width:calc(100vw - 156px)}
 #diary p{font-size:11px}
 #viewTools{right:15px;bottom:24px;display:grid;grid-template-columns:repeat(2,34px);gap:6px}
 #viewTools .icon-button{width:34px;height:34px}
 #toast{bottom:112px}
 #panel[open]~#status{visibility:hidden}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}.loader-symbol{animation:none}}
</style>
</head>
<body>
<main id="world" aria-label="海风小屋立体沙盘"></main>
<details id="panel" open>
 <summary aria-label="展开或收起小屋控制">
  <div class="brand"><span class="brand-mark"><i></i> ROOMMATE ISLE</span><span class="edition">NO. 001</span></div>
  <div class="heading-row"><h1>还住在这里</h1><span class="fold"><i data-lucide="chevron-down"></i></span></div>
  <p class="subtitle" id="homeSubtitle">海风小屋 · 阿绵入住第 1 天</p>
 </summary>
 <div class="controls">
  <div class="section">
   <label for="seed">小岛种子</label>
   <div class="seed-row">
    <input id="seed" value="SEA-BREEZE-01" maxlength="48" spellcheck="false" aria-label="小岛种子">
    <button class="icon-button" id="regenerate" title="重新生成随机种子" aria-label="重新生成随机种子"><i data-lucide="shuffle"></i></button>
    <button class="icon-button" id="applySeed" title="生成输入的种子" aria-label="生成输入的种子"><i data-lucide="arrow-right"></i></button>
   </div>
   <div class="toggle-row"><label class="switch" for="outline"><span>线稿轮廓</span><input id="outline" type="checkbox" checked><span class="switch-track"></span></label><span class="label" id="zoneLabel">午后</span></div>
  </div>
  <div class="section">
   <div class="row between"><label for="time">房间时间</label><output id="timeValue" for="time">16:15</output></div>
   <input id="time" type="range" min="0" max="23.99" step="0.01" value="16.25" aria-label="昼夜时间">
   <div class="time-labels"><span>午夜</span><span>清晨</span><span>正午</span><span>黄昏</span><span>午夜</span></div>
   <div class="actions">
    <button class="command" id="autoTime" aria-pressed="true"><i data-lucide="play"></i><span>时间流转</span></button>
    <button class="command" id="focus" aria-pressed="false"><i data-lucide="focus"></i><span>看看住户</span></button>
   </div>
  </div>
  <div class="section">
   <div class="row between"><span class="resident-line"><i class="resident-dot"></i>阿绵</span><span id="dayLabel">入住第 1 天</span></div>
   <p id="activity" aria-live="polite">把椅子挪到窗边，晒一会儿太阳。</p>
  </div>
 </div>
</details>
<div id="status"><i class="weather-dot"></i><span id="weather">海风小屋 / 晴</span></div>
<div id="diary"><strong id="diaryTime">今日 · 小屋手记</strong><p id="diaryText">窗边的光，今天也来得很早。</p></div>
<nav id="viewTools" aria-label="视角工具">
 <button class="icon-button" id="zoomIn" title="放大" aria-label="放大"><i data-lucide="plus"></i></button>
 <button class="icon-button" id="zoomOut" title="缩小" aria-label="缩小"><i data-lucide="minus"></i></button>
 <button class="icon-button" id="resetView" title="回到等距视角" aria-label="回到等距视角"><i data-lucide="rotate-ccw"></i></button>
 <button class="icon-button" id="screenshot" title="保存当前画面" aria-label="保存当前画面"><i data-lucide="camera"></i></button>
</nav>
<div id="toast" role="status"></div>
<div id="loading"><div class="loader-symbol"></div><span id="loadingText">小屋正在醒来</span><button id="retry" class="command" onclick="location.reload()">重新载入</button></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script type="module">
const $=id=>document.getElementById(id);
try{
 const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
 if(window.lucide) window.lucide.createIcons();
 const TAU=Math.PI*2, TIME_SPEED=.025, SAVE_KEY='roommate-isle-v2', HOME={x:0,z:5};
 const state={seed:'SEA-BREEZE-01',time:16.25,day:1,autoTime:true,outline:true,follow:false};
 const mobile=()=>innerWidth<=700;
 if(mobile()) $('panel').open=false;
 let rngState=1,seedHash=1,root,terrain,room,agent,plant,notebook,lampShade,lampLight;
 let elapsed=0,lastFrame=performance.now(),timeLabel='',uiDay=0,actionKey='',toastTimer;
 let theta=Math.PI/4,phi=Math.acos(1/Math.sqrt(3)),zoom=1,visualZoom=1;
 let focusPoint=new THREE.Vector3(0,2,0),dragDistance=0;
 const pointers=new Map(),outlines=[],trees=[],clouds=[],waves=[];
 const log=[];
 const scene=new THREE.Scene();
 scene.background=new THREE.Color('#a7e5dd');
 const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));
 renderer.setSize(innerWidth,innerHeight);
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFShadowMap;
 renderer.domElement.setAttribute('aria-label','自然起伏的小岛与阿绵的家');
 $('world').appendChild(renderer.domElement);
 const camera=new THREE.OrthographicCamera(-40,40,30,-30,.1,200);
 const ambient=new THREE.AmbientLight(0xffffff,1.05);
 const sun=new THREE.DirectionalLight(0xfff4db,2.3);
 sun.castShadow=true;
 sun.shadow.mapSize.set(768,768);
 Object.assign(sun.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:120});
 sun.shadow.bias=-.00015;
 sun.shadow.normalBias=.035;
 scene.add(ambient,sun,sun.target);
 lampLight=new THREE.PointLight(0xffc164,0,15,2);
 scene.add(lampLight);

 const gradientCanvas=document.createElement('canvas');
 gradientCanvas.width=3;gradientCanvas.height=1;
 const gc=gradientCanvas.getContext('2d');
 ['#686868','#b8b8b8','#ffffff'].forEach((color,i)=>{gc.fillStyle=color;gc.fillRect(i,0,1,1)});
 const gradientMap=new THREE.CanvasTexture(gradientCanvas);
 gradientMap.minFilter=THREE.NearestFilter;gradientMap.magFilter=THREE.NearestFilter;
 gradientMap.generateMipmaps=false;
 const toon=(color,extra={})=>new THREE.MeshToonMaterial({color,gradientMap,...extra});
 const mat={
  land:toon(0xffffff,{vertexColors:true}),sea:toon('#31c4c2',{transparent:true,opacity:.63,depthWrite:false}),
  foam:toon('#f5ffe5',{transparent:true,opacity:.63,depthWrite:false,side:THREE.DoubleSide}),
  floor:toon('#ffe374'),base:toon('#edb735'),wall:toon('#52c5ac'),trim:toon('#fffce8'),
  leaf:toon('#73ce4f'),pine:toon('#229f82'),trunk:toon('#b57842'),stone:toon('#9fb8a4'),
  petal:toon('#ffc24b'),pink:toon('#ff8e9a'),cushion:toon('#fc9d7b'),blanket:toon('#6bc9b7'),
  desk:toon('#d18b55'),paper:toon('#fff8d8'),agent:toon('#ff8a73'),face:toon('#ffedd1'),
  ink:toon('#18211c'),cloud:toon('#ffffff'),pot:toon('#ed9865'),lamp:toon('#ffe888'),
  frame:toon('#f9f8dc'),glass:toon('#b0f1de',{transparent:true,opacity:.6,depthWrite:false}),
  hull:toon('#101b16',{side:THREE.BackSide})
 };
 const materialSet=new Set(Object.values(mat));
 function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
 function random(){rngState=(Math.imul(rngState,1664525)+1013904223)>>>0;return rngState/4294967296}
 function hash2(x,z){let h=Math.imul(x,374761393)^Math.imul(z,668265263)^seedHash;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
 function gradient(x,z,px,pz){const a=hash2(x,z)*TAU;return Math.cos(a)*(px-x)+Math.sin(a)*(pz-z)}
 function fade(t){return t*t*t*(t*(t*6-15)+10)}
 function noise(x,z){
  const ix=Math.floor(x),iz=Math.floor(z),u=fade(x-ix),v=fade(z-iz);
  return THREE.MathUtils.lerp(THREE.MathUtils.lerp(gradient(ix,iz,x,z),gradient(ix+1,iz,x,z),u),THREE.MathUtils.lerp(gradient(ix,iz+1,x,z),gradient(ix+1,iz+1,x,z),u),v)*1.42;
 }
 function fbm(x,z){let n=0,a=.55;for(let i=0;i<4;i++){n+=noise(x,z)*a;x=x*2.03+13;z=z*2.03-7;a*=.49}return n}
 function height(x,z){
  const r=Math.hypot(x+fbm(x*.11,z*.11)*1.8,z+fbm(x*.09+24,z*.09)*1.8);
  const land=1-THREE.MathUtils.smoothstep(r,16.5,24.3);
  const peakX=-7+noise(4.8,8.2)*3,peakZ=-10.5;
  const peak=8.4*Math.exp(-((x-peakX)**2/26+(z-peakZ)**2/27));
  const shoulder=3.4*Math.exp(-((x-6)**2/28+(z+12)**2/22));
  const rolling=1.0+fbm(x*.15,z*.15)*1.6+peak+shoulder;
  let y=THREE.MathUtils.lerp(-3.4,rolling,land);
  const roomBlend=1-THREE.MathUtils.smoothstep(Math.hypot(x-HOME.x,z-HOME.z),9.5,12.8);
  return THREE.MathUtils.lerp(y,1.05,roomBlend);
 }
 function band(y){return new THREE.Color(y<.25?'#ffe04e':y<3.4?'#87d751':y<6.75?'#38c4ae':'#ffffff')}
 function smoothNormalGeometry(geometry){
  const g=geometry.clone(),p=g.attributes.position,n=g.attributes.normal,acc=new Map();
  for(let i=0;i<p.count;i++){
   const key=Math.round(p.getX(i)*10000)+','+Math.round(p.getY(i)*10000)+','+Math.round(p.getZ(i)*10000);
   const a=acc.get(key)||[0,0,0];a[0]+=n.getX(i);a[1]+=n.getY(i);a[2]+=n.getZ(i);acc.set(key,a);
  }
  const normals=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){
   const key=Math.round(p.getX(i)*10000)+','+Math.round(p.getY(i)*10000)+','+Math.round(p.getZ(i)*10000),a=acc.get(key);
   const length=Math.hypot(...a)||1;normals[i*3]=a[0]/length;normals[i*3+1]=a[1]/length;normals[i*3+2]=a[2]/length;
  }
  g.setAttribute('normal',new THREE.BufferAttribute(normals,3));
  return g;
 }
 // The visible mesh stays faceted; a separate smooth-normal shell supplies silhouette-only outlines.
 function addHull(mesh,smoothSource){
  const g=smoothSource?smoothSource.clone():smoothNormalGeometry(mesh.geometry);
  g.computeBoundingSphere();
  const width=Math.min(.055,.022+g.boundingSphere.radius*.007);
  const p=g.attributes.position,n=g.attributes.normal;
  for(let i=0;i<p.count;i++)p.setXYZ(i,p.getX(i)+n.getX(i)*width,p.getY(i)+n.getY(i)*width,p.getZ(i)+n.getZ(i)*width);
  p.needsUpdate=true;
  const shell=new THREE.Mesh(g,mat.hull);
  shell.name='inverted-hull';shell.visible=state.outline;shell.userData.isHull=true;
  mesh.add(shell);outlines.push(shell);
  return mesh;
 }
 function mesh(parent,geometry,material,position=[0,0,0],scale=[1,1,1],outlined=true){
  const m=new THREE.Mesh(geometry,material);m.position.set(...position);m.scale.set(...scale);
  m.castShadow=true;m.receiveShadow=true;
  if(outlined)addHull(m);
  parent.add(m);return m;
 }
 function ellipsoid(parent,r,material,p,s=[1,1,1],detail=1){return mesh(parent,new THREE.IcosahedronGeometry(r,detail),material,p,s)}
 function cylinder(parent,top,bottom,h,material,p,segments=12){return mesh(parent,new THREE.CylinderGeometry(top,bottom,h,segments),material,p)}
 function makeTerrain(){
  const g=new THREE.PlaneGeometry(54,54,60,60);g.rotateX(-Math.PI/2);
  const p=g.attributes.position,idx=g.index.array,indices=[];
  for(let i=0;i<p.count;i++)p.setY(i,height(p.getX(i),p.getZ(i)));
  for(let i=0;i<idx.length;i+=3){
   const x=(p.getX(idx[i])+p.getX(idx[i+1])+p.getX(idx[i+2]))/3;
   const z=(p.getZ(idx[i])+p.getZ(idx[i+1])+p.getZ(idx[i+2]))/3;
   if(Math.hypot(x,z)<26.1)indices.push(idx[i],idx[i+1],idx[i+2]);
  }
  g.setIndex(indices);g.computeVertexNormals();
  const flat=g.toNonIndexed(),fp=flat.attributes.position,colors=new Float32Array(fp.count*3);
  for(let i=0;i<fp.count;i+=3){
   const c=band((fp.getY(i)+fp.getY(i+1)+fp.getY(i+2))/3);
   for(let j=0;j<3;j++){colors[(i+j)*3]=c.r;colors[(i+j)*3+1]=c.g;colors[(i+j)*3+2]=c.b}
  }
  flat.setAttribute('color',new THREE.BufferAttribute(colors,3));flat.computeVertexNormals();
  terrain=new THREE.Mesh(flat,mat.land);terrain.name='continuous-faceted-Perlin-terrain';terrain.receiveShadow=true;
  addHull(terrain,g);root.add(terrain);g.dispose();
 }
 function makeWater(){
  const sea=mesh(root,new THREE.CircleGeometry(29.2,96),mat.sea,[0,-.65,0],[1,1,1],false);
  sea.rotation.x=-Math.PI/2;sea.castShadow=false;sea.receiveShadow=true;sea.renderOrder=2;
  for(let line=0;line<3;line++){
   const points=[];
   for(let i=0;i<=96;i++){
    const angle=i/96*TAU;let low=14,high=26;
    for(let j=0;j<12;j++){const r=(low+high)/2;if(height(Math.cos(angle)*r,Math.sin(angle)*r)>-.52)low=r;else high=r}
    const r=(low+high)/2+line*.62;
    points.push(new THREE.Vector3(Math.cos(angle)*r,-.53,Math.sin(angle)*r));
   }
   const curve=new THREE.CatmullRomCurve3(points.slice(0,-1),true);
   const foam=mesh(root,new THREE.TubeGeometry(curve,72,.035+line*.005,4,true),mat.foam,[0,0,0],[1,1,1],false);
   foam.castShadow=false;foam.receiveShadow=false;foam.renderOrder=3;
   foam.userData={base:new Float32Array(foam.geometry.attributes.position.array),phase:line*1.4};waves.push(foam);
  }
 }
 function makeTree(x,z,pine=false,scale=1){
  const g=new THREE.Group();g.position.set(x,height(x,z),z);g.scale.setScalar(scale);root.add(g);
  cylinder(g,.15,.24,1.5,mat.trunk,[0,.75,0],7);
  if(pine){
   for(let i=0;i<3;i++)mesh(g,new THREE.ConeGeometry(1.08-i*.18,1.65-i*.18,9),mat.pine,[0,1.45+i*.6,0]);

  }else{theta-=dx*.006;phi=THREE.MathUtils.clamp(phi+dy*.005,.48,1.17)}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 });
 canvas.addEventListener('pointerup',e=>{
  if(dragDistance<6&&pointers.size===1){
   const ndc=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);
   raycaster.setFromCamera(ndc,camera);const hit=raycaster.intersectObject(agent,true).find(h=>!h.object.userData.isHull);
   if(hit){toggleFocus(true);toast('阿绵抬起头，向你挥了挥手。');agent.userData.waveUntil=elapsed+2.5}
  }
  pointers.delete(e.pointerId);if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);
 });
 canvas.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));
 canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=THREE.MathUtils.clamp(zoom*Math.exp(-e.deltaY*.001),.7,2.1)},{passive:false});
 window.addEventListener('resize',layout);
 window.addEventListener('pagehide',persist);document.addEventListener('visibilitychange',persist);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('panel').open=false;resetCamera()}});
 setInterval(persist,5000);
 restore();buildWorld();layout();updateCamera(1);renderer.render(scene,camera);$('loading').hidden=true;
 function animate(now){
  const realDt=Math.max(0,(now-lastFrame)/1000);lastFrame=now;const dt=Math.min(realDt,.05);elapsed+=dt;
  if(state.autoTime){const hours=state.time+realDt*TIME_SPEED;state.day+=Math.floor(hours/24);state.time=hours%24}
  updateUI();updateLighting();updateAgent(dt);updateEnvironment(dt);updateCamera(dt);
  if(agent.userData.waveUntil>elapsed){
   const arm=agent.userData.arms[1];arm.rotation.z=-1.8+Math.sin(elapsed*12)*.25;arm.rotation.x=.1;
  }
  renderer.render(scene,camera);requestAnimationFrame(animate);
 }
 lastFrame=performance.now();requestAnimationFrame(animate);
 window.roommateIsle={
  snapshot:()=>({seed:state.seed,time:state.time,day:state.day,autoTime:state.autoTime,outline:state.outline,follow:state.follow,activity:schedule(state.time),agent:{x:agent.position.x,y:agent.position.y,z:agent.position.z,walking:agent.userData.walking},log:log.map(e=>({...e}))}),
  diagnostics:()=>{
   const geometry=terrain.geometry,pos=geometry.attributes.position,counts={beach:0,lowland:0,mountain:0,snow:0};
   let min=Infinity,max=-Infinity,meshCount=0,important=0,missingHulls=0,nonToon=0,cubes=0;
   for(let i=0;i<pos.count;i++){const y=pos.getY(i);min=Math.min(min,y);max=Math.max(max,y);counts[y<.25?'beach':y<3.4?'lowland':y<6.75?'mountain':'snow']++}
   root.traverse(o=>{if(!o.isMesh)return;meshCount++;if(!o.material.isMeshToonMaterial)nonToon++;if(o.geometry.type==='BoxGeometry')cubes++;if(!o.userData.isHull&&o.castShadow){important++;if(!o.children.some(c=>c.userData.isHull))missingHulls++}});
   let fingerprint=2166136261;for(let i=0;i<pos.count;i+=37)fingerprint=Math.imul(fingerprint^Math.round(pos.getY(i)*10000),16777619);
   const projected=agent.position.clone().add(new THREE.Vector3(0,1,0)).project(camera);
   return{revision:THREE.REVISION,orthographic:camera.isOrthographicCamera,shadowType:renderer.shadowMap.type,nonIndexed:geometry.index===null,height:[min,max],zones:counts,meshCount,important,missingHulls,nonToon,cubes,outlines:outlines.length,visibleOutlines:outlines.filter(o=>o.visible).length,hullBackSide:mat.hull.side===THREE.BackSide,gradient:{steps:gradientCanvas.width,nearest:gradientMap.magFilter===THREE.NearestFilter&&gradientMap.minFilter===THREE.NearestFilter},drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,geometries:renderer.info.memory.geometries,terrainFingerprint:fingerprint>>>0,ecologyFingerprint:hash(trees.map(t=>[t.position.x,t.position.y,t.position.z,t.scale.x].join(',')).join('|')),view:{theta,phi,zoom:camera.zoom},agentScreen:{x:(projected.x+1)/2*innerWidth,y:(1-projected.y)/2*innerHeight},canvas:{width:canvas.width,height:canvas.height}};
  }
 };
}catch(error){
 $('loading').hidden=false;$('loading').classList.add('failed');$('loadingText').textContent='小屋暂时没有载入，请检查网络后重试。';console.error(error);
}
