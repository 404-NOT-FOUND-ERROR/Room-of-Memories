<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a7e5dd">
<meta name="description" content="回访香港海滨酒店、都灵合租公寓与松江宿舍：一个自然软萌的低多边形记忆沙盘。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='9' fill='%2380d25a' stroke='%23182d29' stroke-width='2'/%3E%3Cpath d='M8 15l8-7 8 7v10H8z' fill='%23fffef4' stroke='%23182d29' stroke-width='2'/%3E%3C/svg%3E">
<title>还住在这里 · Room of Memories</title>
<style>
:root{--ink:#182d29;--paper:#fffef4;--yellow:#ffe04e;--green:#80d25a;--teal:#2bb6a4;--coral:#ff7d70;--shadow:4px 4px 0 var(--ink)}
*{box-sizing:border-box;letter-spacing:0}
html,body{height:100%;width:100%;margin:0;overflow:hidden;background:#a7e5dd;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--coral);outline-offset:4px}
#world{position:fixed;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%;outline:none}
#panel{position:fixed;z-index:4;left:24px;top:24px;width:292px;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--shadow);max-height:calc(100dvh - 48px);overflow:auto}
summary{list-style:none;cursor:pointer;padding:16px 16px 13px;user-select:none}
summary::-webkit-details-marker{display:none}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand-mark{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:850}
.brand-mark i{width:9px;height:9px;border:1.5px solid var(--ink);background:var(--green);border-radius:50%}
.edition{font-size:10px;font-weight:700;opacity:.55}
.heading-row{display:flex;align-items:center;justify-content:space-between;margin:10px 0 5px}
h1{font-size:26px;line-height:1.15;margin:0;font-weight:900}
.fold{height:26px;width:26px;display:grid;place-items:center;border:1.5px solid var(--ink);background:var(--yellow)}
.fold svg{width:16px;height:16px;transition:transform .16s}
details[open] .fold svg{transform:rotate(180deg)}
.subtitle{font-size:11px;line-height:1.45;opacity:.66;margin:0}
.controls{padding:0 16px 16px;border-top:2px solid var(--ink)}
.places{display:grid;gap:6px;margin-top:8px}
.place{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:9px 10px;border:1.5px solid var(--ink);background:transparent}
.place[aria-pressed=true]{background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
.place-number{font:800 17px ui-monospace,Consolas,monospace;opacity:.5}
.place strong{display:block;font-size:12px}.place small{display:block;font-size:10px;margin-top:3px;opacity:.65}
#placeNote{font-size:10px;line-height:1.7;margin:9px 0 0;opacity:.7}
#residents{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 8px}
.resident-chip{border:1px solid var(--ink);padding:3px 6px;font-size:10px;background:#e9f0dd}
.resident-chip:first-child{background:#ffb2a0}
#worldLabels{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.world-label{position:absolute;white-space:nowrap;font-size:10px;font-weight:750;padding:4px 7px;background:#fffef4ed;border:1px solid var(--ink);box-shadow:2px 2px 0 #182d2933;transform:translate(-50%,-50%)}
.world-label.accent{background:#ffe04ef0}
.section{padding-top:14px}
.section+.section{margin-top:14px;border-top:1px solid #c9d2c8}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
label,.label{font-size:11px;font-weight:800}
.seed-row{display:flex;gap:7px;margin-top:7px}
#seed{min-width:0;width:100%;height:36px;border:1.5px solid var(--ink);background:#f5f8e9;padding:0 9px;font:700 11px ui-monospace,Consolas,monospace}
.icon-button{width:36px;height:36px;flex:none;display:grid;place-items:center;border:1.5px solid var(--ink);background:var(--yellow);box-shadow:2px 2px 0 var(--ink);padding:0}
.icon-button svg{height:17px;width:17px;stroke-width:2}
.icon-button:hover,.command:hover{transform:translate(-1px,-1px)}
.icon-button:active,.command:active{transform:translate(1px,1px);box-shadow:none}
.icon-button[aria-pressed=true]{background:var(--teal)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.switch{position:relative;display:flex;align-items:center;gap:9px;cursor:pointer}
.switch input{position:absolute;width:38px;height:22px;right:0;margin:0;opacity:0;cursor:pointer}
.switch-track{width:34px;height:19px;border:1.5px solid var(--ink);background:#d4e0d4;position:relative;pointer-events:none}
.switch-track:after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--ink);transition:transform .15s}
.switch input:checked+.switch-track{background:var(--green)}
.switch input:checked+.switch-track:after{transform:translateX(15px)}
.switch input:focus-visible+.switch-track{outline:3px solid var(--coral);outline-offset:3px}
#timeValue{font:800 21px/1 ui-monospace,Consolas,monospace}
#time{display:block;width:100%;margin:12px 0 5px;accent-color:var(--coral);cursor:pointer;height:18px}
.time-labels{display:flex;justify-content:space-between;font-size:9px;opacity:.58}
.command{display:flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);background:var(--paper);height:33px;font-size:11px;font-weight:800;padding:0 10px}
.command svg{height:14px;width:14px}
.command[aria-pressed=true]{background:var(--green)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.resident-line{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px;font-weight:800}
.resident-dot{height:12px;width:12px;background:var(--coral);border:1.5px solid var(--ink);border-radius:50%}
#activity{font-size:12px;line-height:1.7;margin:0;min-height:40px}
#dayLabel{font:700 10px ui-monospace,Consolas,monospace;opacity:.58}
#status{position:fixed;z-index:2;right:24px;top:25px;display:flex;align-items:center;gap:9px;font-size:11px;font-weight:750;background:var(--paper);border:1.5px solid var(--ink);padding:8px 12px;box-shadow:2px 2px 0 var(--ink)}
.weather-dot{height:8px;width:8px;border-radius:50%;background:var(--yellow);border:1px solid var(--ink)}
#diary{position:fixed;z-index:2;bottom:26px;left:24px;max-width:280px;border-left:3px solid var(--ink);padding-left:12px;pointer-events:none}
#diary strong{display:block;font-size:10px;opacity:.55;margin-bottom:6px;font-weight:750}
#diary p{font-size:12px;line-height:1.6;margin:0;font-weight:650}
#memoryCard{position:fixed;z-index:8;right:24px;bottom:86px;width:320px;max-height:calc(100dvh - 130px);overflow:auto;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--shadow);padding:15px 16px 14px}
#memoryCard[hidden]{display:none}
.memory-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.memory-kicker{font-size:10px;font-weight:850;opacity:.58}
#memoryClose{width:24px;height:24px;border:1.5px solid var(--ink);background:var(--yellow);font-size:18px;line-height:1;padding:0}
#memoryTitle{font-size:18px;line-height:1.25;margin:10px 0 7px;font-weight:900}
#memoryText{font-size:12px;line-height:1.7;margin:0;font-weight:650}
#memoryMeta{font-size:10px;line-height:1.5;margin:10px 0 0;opacity:.58}
#memoryForm{margin-top:14px;border-top:1px solid #c9d2c8;padding-top:12px}
#memoryNote{display:block;width:100%;min-height:80px;resize:vertical;border:1px solid var(--ink);background:#f5f8e9;padding:9px;margin:7px 0;font:inherit;font-size:12px;line-height:1.6;color:var(--ink)}
.memory-save-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#memorySaveStatus{font-size:10px;opacity:.65}
#memoryShelf{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.memory-chip{border:1px solid var(--ink);background:#f5f8e9;padding:5px 6px;font-size:10px;font-weight:750;min-height:28px}
.memory-chip[data-found=true]{background:#c8efad}
#lifeButton{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;border-bottom:1px solid #c9d2c8;background:transparent;padding:10px 0 3px;font-size:10px;text-align:left}
#memoryJournal{display:grid;gap:10px;margin-top:13px}
.memory-entry{border-left:2px solid var(--teal);padding-left:9px}
.memory-entry small{font-size:9px;opacity:.6}.memory-entry p{margin:3px 0 0;font-size:11px;line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap}
#memoryJournal:empty,#memoryJournal[hidden]{display:none}
#memoryProgress{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 7px;font-size:10px;opacity:.7}
#memoryProgress strong{font:800 11px ui-monospace,Consolas,monospace;opacity:.85}
.memory-marker{pointer-events:auto;cursor:pointer;color:var(--ink);font-size:10px;font-weight:750;line-height:1.2}
.memory-marker[data-found=true]{background:#c8efadf2}
.memory-marker[data-active=true]{border-color:#238d77;box-shadow:0 0 0 2px #238d7755,2px 2px 0 #182d2933}
.memory-marker:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
#viewTools{position:fixed;right:24px;bottom:26px;z-index:3;display:flex;gap:8px}
#viewTools .icon-button{background:var(--paper);height:38px;width:38px}
#viewTools .icon-button[aria-pressed=true]{background:var(--yellow)}
#toast{position:fixed;z-index:10;left:50%;bottom:26px;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:10px 15px;color:var(--paper);background:var(--ink);font-size:12px;transition:.18s;max-width:calc(100vw - 30px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;z-index:12;background:#a7e5dd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;font-size:13px;font-weight:750}
#loading[hidden]{display:none}
.loader-symbol{width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;border-top-color:transparent;animation:spin 1s linear infinite}
#retry{display:none}
#loading.failed .loader-symbol{animation:none;border-top-color:var(--ink);background:var(--coral)}
#loading.failed #retry{display:flex}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){
 #panel{left:12px;top:12px;width:calc(100% - 24px);max-height:calc(100dvh - 150px)}
 summary{padding:11px 13px 10px}
 .brand{display:none}.heading-row{margin:0 0 4px}h1{font-size:22px}
 .fold{height:24px;width:24px}.subtitle{font-size:10px}
 .controls{padding:0 13px 13px}
 .section{padding-top:10px}.section+.section{margin-top:10px}
 #status{top:111px;right:14px;padding:6px 9px;font-size:10px}
 #diary{left:16px;bottom:24px;max-width:calc(100vw - 156px)}
 #diary p{font-size:11px}
 #memoryCard{left:12px;right:12px;bottom:104px;width:auto;padding:13px 14px}
 #memoryTitle{font-size:17px;margin-top:8px}
 #memoryText{font-size:11px}
 #viewTools{right:15px;bottom:24px;display:grid;grid-template-columns:repeat(2,34px);gap:6px}
 #viewTools .icon-button{width:34px;height:34px}
 #toast{bottom:112px}
 #panel[open]~#status{visibility:hidden}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}.loader-symbol{animation:none}}
</style>
</head>
<body>
<main id="world" aria-label="记忆房间立体沙盘"></main>
<div id="worldLabels" aria-label="房间标记"></div>
<details id="panel" open>
 <summary aria-label="展开或收起小屋控制">
  <div class="brand"><span class="brand-mark"><i></i> ROOM OF MEMORIES</span><span class="edition" id="edition">01 / 03</span></div>
  <div class="heading-row"><h1>还住在这里</h1><span class="fold"><i data-lucide="chevron-down"></i></span></div>
  <p class="subtitle" id="homeSubtitle">香港 · 海滨酒店</p>
 </summary>
 <div class="controls">
  <div class="section">
   <span class="label">回到一处记忆</span>
   <div class="places" role="group" aria-label="选择记忆地点">
     <button class="place" data-place="hotel" aria-pressed="true"><span class="place-number">01</span><span><strong>香港 · 嘉里酒店</strong><small>高层海景 / 现代酒店 / 一位住户</small></span></button>
     <button class="place" data-place="turin" aria-pressed="false"><span class="place-number">02</span><span><strong>都灵 · 合租公寓</strong><small>2 楼（0 楼起算）/ 三位住户</small></span></button>
    <button class="place" data-place="dorm" aria-pressed="false"><span class="place-number">03</span><span><strong>松江 · 30 号楼</strong><small>大学校园 / 三年 / 四位住户</small></span></button>
   </div>
   <p id="placeNote">高层客房的大窗望向海港，现代楼群沿着海岸展开。</p>
  </div>
  <div class="section">
   <label for="seed">这一处的风景种子</label>
   <div class="seed-row">
    <input id="seed" value="HARBOUR-01" maxlength="48" spellcheck="false" aria-label="风景种子">
    <button class="icon-button" id="regenerate" title="重新生成随机种子" aria-label="重新生成随机种子"><i data-lucide="shuffle"></i></button>
    <button class="icon-button" id="applySeed" title="生成输入的种子" aria-label="生成输入的种子"><i data-lucide="arrow-right"></i></button>
   </div>
   <div class="toggle-row"><label class="switch" for="outline"><span>线稿轮廓</span><input id="outline" type="checkbox" checked><span class="switch-track"></span></label><span class="label" id="zoneLabel">午后</span></div>
  </div>
  <div class="section">
   <div class="row between"><label for="time">房间时间</label><output id="timeValue" for="time">16:15</output></div>
   <input id="time" type="range" min="0" max="23.99" step="0.01" value="16.25" aria-label="昼夜时间">
   <div class="time-labels"><span>午夜</span><span>清晨</span><span>正午</span><span>黄昏</span><span>午夜</span></div>
   <div class="actions">
    <button class="command" id="autoTime" aria-pressed="true"><i data-lucide="play"></i><span>时间流转</span></button>
    <button class="command" id="focus" aria-pressed="false"><i data-lucide="focus"></i><span>看看住户</span></button>
   </div>
  </div>
  <div class="section">
   <div class="row between"><span class="resident-line"><i class="resident-dot"></i>这里的生活</span><span id="dayLabel">生活第 1 天</span></div>
   <div id="residents"></div>
   <div id="memoryProgress"><span>房间里的记忆物件</span><strong>0 / 3</strong></div>
   <div id="memoryShelf" aria-label="记忆物件"></div>
   <button id="lifeButton" type="button" aria-controls="memoryCard" aria-expanded="false"><span>这儿留下的小事</span><span id="lifeCount">0</span></button>
   <p id="activity" aria-live="polite">把椅子挪到窗边，晒一会儿太阳。</p>
  </div>
 </div>
</details>
<div id="status"><i class="weather-dot"></i><span id="weather">香港 · 红磡湾 / 晴</span></div>
<div id="diary"><strong id="diaryTime">今日 · 小屋手记</strong><p id="diaryText">窗边的光，今天也来得很早。</p></div>
<aside id="memoryCard" hidden role="dialog" aria-live="polite" aria-labelledby="memoryTitle">
 <div class="memory-card-head"><span class="memory-kicker" id="memoryKicker">房间片段 · 创作</span><button id="memoryClose" type="button" aria-label="关闭记忆卡片">×</button></div>
 <h2 id="memoryTitle">窗边的房卡</h2>
 <p id="memoryText"></p>
 <p id="memoryMeta"></p>
 <form id="memoryForm">
  <label for="memoryNote">我的记忆</label>
  <textarea id="memoryNote" maxlength="600" placeholder="写下这件物品让你想起的事" aria-label="写下与这件物品有关的记忆"></textarea>
  <div class="memory-save-row"><span id="memorySaveStatus" role="status"></span><button id="memorySave" class="command" type="submit">留下这句话</button></div>
 </form>
 <div id="memoryJournal" hidden></div>
</aside>
<nav id="viewTools" aria-label="视角工具">
 <button class="icon-button" id="zoomIn" title="放大" aria-label="放大"><i data-lucide="plus"></i></button>
 <button class="icon-button" id="zoomOut" title="缩小" aria-label="缩小"><i data-lucide="minus"></i></button>
 <button class="icon-button" id="resetView" title="回到等距视角" aria-label="回到等距视角"><i data-lucide="rotate-ccw"></i></button>
 <button class="icon-button" id="screenshot" title="保存当前画面" aria-label="保存当前画面"><i data-lucide="camera"></i></button>
</nav>
<div id="toast" role="status"></div>
<div id="loading"><div class="loader-symbol"></div><span id="loadingText">小屋正在醒来</span><button id="retry" class="command" onclick="location.reload()">重新载入</button></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script type="module">
const $=id=>document.getElementById(id);
try{
 const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
 if(window.lucide) window.lucide.createIcons();

  turin:{name:'都灵合租公寓',region:'都灵 · 住宅街区 · 2楼',seed:'TORINO-01',edition:'02 / 03',sky:'#e9d8bc',note:'住了一年的三室一厅。你在按 0 楼起算的 2 楼，三个人各有自己的房间，也共享客厅。',people:['阿绵','小榆','洛洛'],facts:{bedrooms:3,residents:3,balconies:0,loftBeds:0,sharedLiving:true,floorIndex:2,floorLabel:'2楼（0楼起算）'}},
  dorm:{name:'松江 30 号楼',region:'东华大学 · 松江校区',seed:'CAMPUS-30',edition:'03 / 03',sky:'#d2e9b6',note:'住了三年的四人间。四组上床下桌、一个小阳台，公共卫浴在门外的楼层走廊。',people:['阿绵','小榆','洛洛','小禾'],facts:{bedrooms:1,residents:4,balconies:1,loftBeds:4,sharedLiving:false,bathroom:'outside-shared'}}
 };
 const state={place:'hotel',seed:'HARBOUR-01',time:16.25,day:1,returnCount:0,autoTime:true,outline:true,follow:false};
 const MEMORY_ITEMS={
  hotel:[
   {id:'hotel-room-card',tag:'房卡',title:'退房前的房卡',story:'海港天色暗下来时，房卡被留在桌边。短短几天，也足以让一个陌生房间变得熟悉。',again:['这次回来，房卡仍停在故事的入口。窗外的海港换了光，房间替你留住这段傍晚。','离开的那一刻很短，重新看见这张房卡时，旅途又有了一处可以停靠的地方。'],position:[3.5,1.62,-3.8],kind:'card'},
   {id:'hotel-suitcase',tag:'行李箱',title:'还没合上的行李箱',story:'行李箱停在房间一角。它提醒人们，酒店房间总有一个“暂住”的时间；也正因为会离开，才更记得窗外那片海。',again:['行李箱还在角落里。回来看看时，目的地已经换了，房间里的这段停留却还在。','它像一段旅行的句号，也像下一次出发前留下的逗号。'],position:[-7.5,.65,5.4],kind:'suitcase'},
   {id:'hotel-tea',tag:'纸杯',title:'窗边的一杯热饮',story:'杯子放在窗边，海面的光落进来。或许什么都没有发生，只是有人在这里慢下来了一会儿。',again:['杯子已经凉了，窗外仍然有船经过。这样的小小停顿，也值得被留在记忆里。','海港没有重复同一束光，但窗边的位置还在等下一个安静片刻。'],position:[5.8,.61,3.9],kind:'cup'}

   state.day=Number.isInteger(source.day)&&source.day>0?source.day:1;state.returnCount=Number.isInteger(source.returnCount)&&source.returnCount>=0?source.returnCount:0;state.autoTime=source.autoTime!==false;
   memoryState={notes:{...(source.memoryState?.notes||{})},discoveries:{...(source.memoryState?.discoveries||{})},events:Array.isArray(source.memoryState?.events)?source.memoryState.events.slice(-24):[],eventKeys:Array.isArray(source.memoryState?.eventKeys)?source.memoryState.eventKeys.slice(-24):[],activeItem:null};

 function restore(){
  try{
    const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!saved)return;

 const canvas=renderer.domElement,raycaster=new THREE.Raycaster();
 canvas.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});dragDistance=0;canvas.setPointerCapture(e.pointerId);
 });
 canvas.addEventListener('pointermove',e=>{
  const prev=pointers.get(e.pointerId);if(!prev)return;
  const dx=e.clientX-prev.x,dy=e.clientY-prev.y;dragDistance+=Math.hypot(dx,dy);
  if(pointers.size===2){
   const other=[...pointers.entries()].find(([id])=>id!==e.pointerId)?.[1];
   if(other){const oldDistance=Math.hypot(prev.x-other.x,prev.y-other.y);const newDistance=Math.hypot(e.clientX-other.x,e.clientY-other.y);if(oldDistance>5)zoom=THREE.MathUtils.clamp(zoom*newDistance/oldDistance,.7,2.1)}
  }else{theta-=dx*.006;phi=THREE.MathUtils.clamp(phi+dy*.005,.48,1.17)}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 });
 canvas.addEventListener('pointerup',e=>{
  if(dragDistance<6&&pointers.size===1){
   const ndc=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);
   raycaster.setFromCamera(ndc,camera);
   const memoryHit=raycaster.intersectObjects(memoryObjects,true).find(h=>!h.object.userData.isHull);
   if(memoryHit){let memory=memoryHit.object,id=memory.userData.memoryId;while(memory&&!id){memory=memory.parent;id=memory?.userData.memoryId}const item=memoryItem(id);if(item){openMemory(item);pointers.delete(e.pointerId);if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);return}}
   const hit=raycaster.intersectObjects(residents,true).find(h=>!h.object.userData.isHull);
   if(hit){let actor=hit.object;while(actor&&!residents.includes(actor))actor=actor.parent;
    if(actor){focusedResident=residents.indexOf(actor);toggleFocus(true);toast(actor.userData.person+'抬起头，向你挥了挥手。');actor.userData.waveUntil=elapsed+2.5}
   }
  }
  pointers.delete(e.pointerId);if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);
 });
 canvas.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));

 setInterval(persist,5000);
 restore();state.returnCount+=1;buildWorld();persist();layout();updateCamera(1);updateLabels();renderer.render(scene,camera);$('loading').hidden=true;
 function animate(now){
  const realDt=Math.max(0,(now-lastFrame)/1000);lastFrame=now;const dt=Math.min(realDt,.05);elapsed+=dt;
  if(state.autoTime){const hours=state.time+realDt*TIME_SPEED;state.day+=Math.floor(hours/24);state.time=hours%24}
  updateUI();updateLighting();updateAgent(dt);updateEnvironment(dt);updateCamera(dt);updateLabels();
  residents.forEach(actor=>{if(actor.userData.waveUntil>elapsed){
   const arm=actor.userData.arms[1];arm.rotation.z=-1.8+Math.sin(elapsed*12)*.25;arm.rotation.x=.1;
  }});
  renderer.render(scene,camera);requestAnimationFrame(animate);
 }
 lastFrame=performance.now();requestAnimationFrame(animate);
 window.roommateIsle={
  snapshot:()=>({
   place:state.place,placeName:place().name,seed:state.seed,time:state.time,day:state.day,autoTime:state.autoTime,outline:state.outline,follow:state.follow,
   activity:schedule(state.time),residents:residents.map(actor=>({person:actor.userData.person,station:actor.userData.station,walking:actor.userData.walking,routeLength:actor.userData.route.length,x:actor.position.x,y:actor.position.y,z:actor.position.z})),
   agent:{x:agent.position.x,y:agent.position.y,z:agent.position.z,walking:agent.userData.walking},log:log.map(e=>({...e})),
   returnCount:state.returnCount,memories:memoryObjects.map(object=>{

   }),lifeEvents:memoryState.events.map(entry=>({...entry}))
  }),
  diagnostics:()=>{
   const geometry=terrain.geometry,pos=geometry.attributes.position,counts={beach:0,lowland:0,mountain:0,snow:0};

   for(let i=0;i<pos.count;i++){const y=pos.getY(i);min=Math.min(min,y);max=Math.max(max,y);counts[y<.25?'beach':y<3.4?'lowland':y<6.75?'mountain':'snow']++}
   const features={};root.traverse(o=>{if(!o.isMesh)return;meshCount++;if(!o.material.isMeshToonMaterial)nonToon++;if(o.geometry.type==='BoxGeometry')cubes++;if(o.userData.feature)features[o.userData.feature]=(features[o.userData.feature]||0)+1;if(o.userData.loft)features.loftBed=(features.loftBed||0)+1;if(!o.userData.isHull&&o.castShadow){important++;if(!o.children.some(c=>c.userData.isHull))missingHulls++}});
   let fingerprint=2166136261;for(let i=0;i<pos.count;i+=37)fingerprint=Math.imul(fingerprint^Math.round(pos.getY(i)*10000),16777619);
   const projected=agent.position.clone().add(new THREE.Vector3(0,1,0)).project(camera);
   return{place:state.place,placeName:place().name,declared:place().facts,structures:features,residentCount:residents.length,memoryCount:memoryObjects.length,invalidMemoryTransforms:memoryObjects.filter(object=>![...object.position.toArray(),...object.rotation.toArray().slice(0,3)].every(Number.isFinite)).length,routeLengths:residents.map(actor=>actor.userData.route.length),revision:THREE.REVISION,orthographic:camera.isOrthographicCamera,shadowType:renderer.shadowMap.type,nonIndexed:geometry.index===null,height:[min,max],zones:counts,meshCount,important,missingHulls,nonToon,cubes,outlines:outlines.length,visibleOutlines:outlines.filter(o=>o.visible).length,hullBackSide:mat.hull.side===THREE.BackSide,gradient:{steps:gradientCanvas.width,nearest:gradientMap.magFilter===THREE.NearestFilter&&gradientMap.minFilter===THREE.NearestFilter},drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,geometries:renderer.info.memory.geometries,terrainFingerprint:fingerprint>>>0,ecologyFingerprint:hash(trees.map(t=>[t.position.x,t.position.y,t.position.z,t.scale.x].join(',')).join('|')),view:{theta,phi,zoom:camera.zoom},agentScreen:{x:(projected.x+1)/2*innerWidth,y:(1-projected.y)/2*innerHeight},canvas:{width:canvas.width,height:canvas.height}};
  }
